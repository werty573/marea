    b.el.style.opacity = op * fx.show;
  }
}

/* ================================================================ */
/*  Card renders: the same can, photographed for each flavour         */
/* ================================================================ */
async function renderCards() {
  const W2 = 280, H2 = 420;
  const r2 = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r2.setSize(W2, H2); r2.toneMapping = THREE.NeutralToneMapping; r2.setClearColor(0, 0);
  const s2 = new THREE.Scene(); s2.environmentIntensity = 1.1; s2.environmentRotation.set(0, .9, 0);
  const pm = new THREE.PMREMGenerator(r2);
  s2.environment = hdrTex ? pm.fromEquirectangular(hdrTex).texture : pm.fromScene(new RoomEnvironment(), .04).texture;
  s2.add(key.clone(), rim.clone());
  const cam2 = new THREE.PerspectiveCamera(22, W2 / H2, .1, 50); cam2.position.set(0, .2, 8.4); cam2.lookAt(0, .02, 0);
  const copy = canSpin.clone(true); copy.rotation.set(.08, -.15, 0); s2.add(copy);
  const bodyCopy = copy.children[0];
  for (let f = 0; f < 2; f++) {
    bodyCopy.material = bodyMat.clone(); bodyCopy.material.map = wraps[f];
    r2.render(s2, cam2);
    $$('.card img')[f].src = r2.domElement.toDataURL('image/png');
  }
  r2.dispose();
}

/* ================================================================ */
/*  Flavour switch: colour flood, 720° spin w/ blur, implode → swap → explode */
/* ================================================================ */
let switching = false;
function setFlavor(f) {
  if (f === flavor || switching) return;
  switching = true;
  const prev = flavor; flavor = f;
  $$('.card').forEach((c, i) => c.classList.toggle('active', i === f));
  document.body.classList.toggle('blue-theme', f === 1);
  const swap = () => {
    bodyMat.map = wraps[f]; bodyMat.needsUpdate = true;
    items.forEach(it => { if (it.pair) { it.pair.ch.visible = f === 0; it.pair.bl.visible = f === 1; } });
    reseed();
    items.forEach(it => it.spin.set((rand() - .5) * 10, (rand() - .5) * 10, (rand() - .5) * 6));
  };
  if (RM) { swap(); switching = false; return; }
  gsap.timeline({ onComplete: () => { switching = false; } })
    .to(C, { spin: `+=${Math.PI * 4}`, duration: 1.25, ease: 'swirl' }, 0)
    .to(C, { squash: 1, duration: .45, ease: 'power2.in' }, 0).to(C, { squash: 0, duration: .8, ease: 'pop' }, .45)
    .to(fx, { collapse: 1, duration: .45, ease: 'power3.in' }, 0)
    .call(swap, null, .45)
    .to(fx, { collapse: 0, duration: 1.1, ease: 'fizz' }, .47);
}

/* ================================================================ */
/*  Boot                                                             */
/* ================================================================ */
addEventListener('pointermove', e => {
  pointer.px = e.clientX; pointer.py = e.clientY;
  pointer.x = e.clientX / W * 2 - 1; pointer.y = -(e.clientY / H) * 2 + 1; pointer.active = true;
}, { passive: true });
document.addEventListener('pointerleave', () => { pointer.active = false; });
$$('.card').forEach(c => c.addEventListener('click', () => setFlavor(+c.dataset.flavor)));
$$('.nav-arrow').forEach(b => b.addEventListener('click', () => setFlavor((flavor + 2 + +b.dataset.step) % 2)));

let last = performance.now() / 1000;
const bootT = last;
gsap.ticker.add(() => {
  const now = performance.now() / 1000, dt = now - last; last = now;
  update(dt, now); render(); updateBubbles(now);
});

await Promise.race([Promise.all([document.fonts.ready, envReady]), new Promise(r => setTimeout(r, 4000))]);
wraps.forEach(t => t.needsUpdate = true);
// the wrap uses the webfonts, so redraw once they're in
wraps[0].image = drawWrap(0).image; wraps[1].image = drawWrap(1).image; wraps.forEach(t => t.needsUpdate = true);
bodyMat.map = wraps[flavor];
renderCards().catch(() => {});

// entrance: titles rise through masks, the can drops in spinning, berries burst out of it
const lines = $$('.title-line > span');
if (RM) { fx.collapse = 0; fx.show = 1; }
else {
  gsap.set(lines, { yPercent: 115 });
  gsap.set(['.header', '.description', '.cta-group', '.award-badge', '.product-carousel', '.concept'], { opacity: 0, y: 24 });
  C.y = 4.5; C.spin = -Math.PI * 2; C.s = .7;
  gsap.timeline({ delay: .1 })
    .to(C, { y: 0, duration: 1.6, ease: 'fizz' }, 0)
    .to(C, { spin: 0, duration: 1.8, ease: 'fizz' }, 0)
    .to(C, { s: 1, duration: 1.4, ease: 'pop' }, .1)
    .to(fx, { show: 1, duration: .01 }, .3)
    .to(fx, { collapse: 0, duration: 1.6, ease: 'fizz' }, .3)
    .to(lines, { yPercent: 0, duration: 1.3, ease: 'fizz', stagger: .09 }, .35)
    .to(['.header', '.description', '.cta-group', '.award-badge', '.product-carousel', '.concept'], { opacity: 1, y: 0, duration: 1, ease: 'fizz', stagger: .07 }, .6);
}
document.body.dataset.ready = '1';
window.__soda = { setFlavor, pointer };
</script>
</body>
